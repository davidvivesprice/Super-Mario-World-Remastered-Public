name: Build Windows
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.4.1.stable ~/.local/share/godot/export_templates/4.4.1.stable || true
      - name: Import + export (release)
        run: |
          mkdir -p build/windows
          godot --headless --import . || true
          godot --headless --export-release "Windows Desktop" build/windows/SuperMarioWorldRemastered.exe
      - name: List build
        run: ls -la build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: SMW-Remastered-Windows
          path: build/windows/
          if-no-files-found: error
